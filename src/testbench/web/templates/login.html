{% extends "base.html" %}
{% block title %}Sign in · Testbench{% endblock %}
{% block page_class %} auth{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <div class="panel-body form">
    <div class="auth-head">
      {{ logo("logo large") }}
      <h1>Sign in to Testbench</h1>
      <p class="muted">Each workspace is visible only to its members.</p>
    </div>
    <form class="form" method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary block" type="submit">Sign in</button>
    </form>
  </div>
</section>
{% endblock %}
