<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Testbench{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="shell">
    <a class="brand" href="/">Testbench</a>
    {% if user %}
    <div class="who">
      <span>{{ user.name }}</span>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button class="link" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<div class="flash {{ m.kind }}">{{ m.message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
