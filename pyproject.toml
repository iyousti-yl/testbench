[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testbench"
version = "0.1.0"
description = "Business-scenario regression testing for SAP data landscapes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
datasphere = ["hdbcli>=2.19"]
successfactors = ["cryptography>=42"]  # OAuth 2.0 SAML bearer signing
web = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
  "cryptography>=42",
]
dev = ["testbench[web]", "pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
testbench = "testbench.cli:main"

[project.entry-points."testbench.connectors"]
sqlite = "testbench.connectors.sqlite:SQLiteConnector"
datasphere = "testbench.connectors.datasphere:DatasphereConnector"
successfactors = "testbench.connectors.successfactors:SuccessFactorsConnector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testbench = ["schema/*.json", "web/templates/*", "web/static/*", "web/static/fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
