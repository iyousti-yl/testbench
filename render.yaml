# Testbench on Render (free plan). Synthetic or sandbox data only: never a client's
# production tenant. The free plan sleeps after inactivity and has no persistent disk, so
# workspaces and runs disappear on every restart.
services:
  - type: web
    name: testbench
    runtime: docker
    plan: free
    region: frankfurt
    branch: feat/hosted-demo   # switch to main once the open pull requests are merged
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: TESTBENCH_SECRET_KEY
        generateValue: true
      - key: TESTBENCH_ADMIN_EMAIL
        sync: false
      - key: TESTBENCH_ADMIN_PASSWORD
        sync: false
